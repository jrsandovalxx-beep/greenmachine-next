# GreenMachine HR v1 — PRODUCTION model configuration (D-071, 2026-08-20).
#
# Ratified by the Product Owner's 2026-08-20 directive as the provisional v1
# grading table for the live research dashboard. Bucket boundaries and sample
# floors are PROVISIONAL pending Q11-Q16 ratification; changing them is a
# config-only edit. Engineering invents no thresholds beyond this ratified,
# reviewable file. D-174 (PO, 2026-09-02): sweet_spot_pct retired — the
# season-long review found it carries almost no home-run signal.

schema_version: 1
model_configuration_version: "gm-hr-v1-0"
specification_version: "v6.3"

fuzzy_scoring:
  enabled: false

# D-186 (PO build order item 5, "HR chance" reading 2026-09-05): the total
# score mapped to the calibrated chance the batter homers on the slate day,
# percent scale, piecewise-linear through the anchors, flat past both ends.
# Anchors are the measured bin centers of the 42-slate backtest (10,278
# graded batter-days, 2026-07-25 .. 2026-09-04, regraded as of the prior
# evening — no look-ahead): 3.6% at 0-2 points up to 15.3% at 9-10. The S
# band holds the 9.5-point rate until a real S sample exists (6 batter-days
# in the run homered 0 — too thin to calibrate).
hr_chance:
  - { score: "1", chance: "5.8" }
  - { score: "2.5", chance: "5.8" }
  - { score: "3.5", chance: "7.2" }
  - { score: "4.5", chance: "9.2" }
  - { score: "5.5", chance: "11.6" }
  - { score: "6.5", chance: "13.6" }
  - { score: "7.5", chance: "14.6" }
  - { score: "8.5", chance: "14.9" }
  - { score: "9.5", chance: "15.7" }

allocations:
  total_max_points: "11.3"

  categories:
    - category: power_profile
      max_points: "4"
      components: [exit_velocity, barrel_pct, hard_hit_pct]
    - category: pitcher_matchup
      max_points: "3"
      components: [pitch_mix_pressure, put_away_pitch_exploitation]
    - category: form
      max_points: "1.3"
      components: [attack_angle_quality, bat_speed]
    - category: pull_power
      max_points: "1"
      components: [pull_pct_air_balls]
    - category: environment
      max_points: "2"
      components: [park, weather]

  grade_cutoffs:
    - { grade: D, lower: "0", upper: "4", terminal: false }
    - { grade: C, lower: "4", upper: "6", terminal: false }
    - { grade: B, lower: "6", upper: "8", terminal: false }
    - { grade: A, lower: "8", upper: "10", terminal: false }
    - { grade: S, lower: "10", upper: "11.3", terminal: true }

components:
  - component_id: exit_velocity
    scoring_method: bucketed
    direction: higher_is_better
    max_points: "1.5"
    # D-184: league-average award measured over the 381-batter 2026 season
    # board (0.397); substitutes when missing, anchors shrinkage at k=15 BBE.
    # D-188: rescaled x1.5 with max_points; the prior stays 40% of max.
    prior_points: "0.6"
    shrink_strength: 15
    sample_type: batted_ball_events
    missing_data:
      policy: record_missing
      reasons: [NO_EVENTS_IN_WINDOW, TRACKING_UNAVAILABLE, INVALID_SOURCE_VALUE, SOURCE_UNAVAILABLE, PLAYER_NOT_COVERED]
    applicable_profiles: [RECENT_7D]
    profiles:
      - window_profile: RECENT_7D
        minimum_sample_required: 15
        scoring:
          - method: bucketed
            domain_min: "0"
            domain_max: "130"
            buckets:
              - { lower: "0", upper: "86", points: "0" }
              - { lower: "86", upper: "88", points: "0.375" }
              - { lower: "88", upper: "89.5", points: "0.675" }
              - { lower: "89.5", upper: "91", points: "0.975" }
              - { lower: "91", upper: "92", points: "1.2" }
              - { lower: "92", upper: "93", points: "1.35" }
              - { lower: "93", upper: "130", points: "1.5" }
  - component_id: barrel_pct
    scoring_method: bucketed
    direction: higher_is_better
    max_points: "2"
    # D-184: league-average award 0.434 (2026 season board, 381 batters).
    # D-188: rescaled x2 with max_points; the prior stays 43% of max.
    prior_points: "0.86"
    shrink_strength: 15
    sample_type: batted_ball_events
    missing_data:
      policy: record_missing
      reasons: [NO_EVENTS_IN_WINDOW, TRACKING_UNAVAILABLE, INVALID_SOURCE_VALUE, SOURCE_UNAVAILABLE, PLAYER_NOT_COVERED]
    applicable_profiles: [RECENT_7D]
    profiles:
      - window_profile: RECENT_7D
        minimum_sample_required: 15
        scoring:
          - method: bucketed
            domain_min: "0"
            domain_max: "100"
            buckets:
              - { lower: "0", upper: "5", points: "0" }
              - { lower: "5", upper: "7", points: "0.5" }
              - { lower: "7", upper: "9", points: "1" }
              - { lower: "9", upper: "11", points: "1.4" }
              - { lower: "11", upper: "13", points: "1.7" }
              - { lower: "13", upper: "100", points: "2" }
  - component_id: hard_hit_pct
    scoring_method: bucketed
    direction: higher_is_better
    max_points: "0.5"
    # D-184: league-average award 0.392 (2026 season board, 381 batters).
    # D-188: rescaled x0.5 with max_points; the prior stays 39% of max.
    prior_points: "0.195"
    shrink_strength: 15
    sample_type: batted_ball_events
    missing_data:
      policy: record_missing
      reasons: [NO_EVENTS_IN_WINDOW, TRACKING_UNAVAILABLE, INVALID_SOURCE_VALUE, SOURCE_UNAVAILABLE, PLAYER_NOT_COVERED]
    applicable_profiles: [RECENT_7D]
    profiles:
      - window_profile: RECENT_7D
        minimum_sample_required: 15
        scoring:
          - method: bucketed
            domain_min: "0"
            domain_max: "100"
            buckets:
              - { lower: "0", upper: "35", points: "0" }
              - { lower: "35", upper: "40", points: "0.125" }
              - { lower: "40", upper: "43", points: "0.25" }
              - { lower: "43", upper: "46", points: "0.35" }
              - { lower: "46", upper: "50", points: "0.425" }
              - { lower: "50", upper: "100", points: "0.5" }
  - component_id: pitch_mix_pressure
    scoring_method: bucketed
    direction: higher_is_better
    max_points: "1.5"
    sample_type: pitches
    # D-180 (PO-approved D-175 light buff): the measured slow-fastball
    # edge — batter season ISO vs FB <92.5 clears his ISO vs FB 94.5+ by
    # .05+ (15 PA per band) and the starter's season FB velocity is
    # 92.5 or under — adds 0.2 points on top of the bucket award, capped
    # at the component max. Pair-day validation: +24%.
    bonuses:
      - bonus_id: slow_fastball_edge
        points: "0.2"
    # D-184: league-average award 0.559 over 15,145 floored pair-days. No
    # shrinkage: the value is a season-cumulative ISO, already stable.
    prior_points: "0.56"
    missing_data:
      policy: record_missing
      reasons: [EXPECTED_PITCHER_UNKNOWN, SOURCE_UNAVAILABLE, PLAYER_NOT_COVERED, NO_EVENTS_IN_WINDOW]
    applicable_profiles: [RECENT_7D]
    profiles:
      - window_profile: RECENT_7D
        minimum_sample_required: 50
        scoring:
          # D-178 (2026-09-03): usage-weighted batter ISO against the
          # starter's qualifying mix, percent scale (ISO .180 = 18). Edges
          # from the measurement run, validated pair-level with no
          # look-ahead: -34% under .10, crossover ~.12, +83% at .30+.
          # Domain runs to 400: ISO's ceiling is 4.000 on thin samples
          # (D-179). The slow-FB buff awaits its engine mechanism.
          - method: bucketed
            domain_min: "0"
            domain_max: "400"
            buckets:
              - { lower: "0", upper: "10", points: "0" }
              - { lower: "10", upper: "15", points: "0.4" }
              - { lower: "15", upper: "20", points: "0.7" }
              - { lower: "20", upper: "25", points: "0.9" }
              - { lower: "25", upper: "30", points: "1.1" }
              - { lower: "30", upper: "400", points: "1.5" }
  - component_id: put_away_pitch_exploitation
    scoring_method: bucketed
    direction: higher_is_better
    max_points: "1.5"
    # D-184: league-average award 0.613 over 12,464 floored pair-days. No
    # shrinkage: the value is a season-cumulative ISO, already stable.
    prior_points: "0.61"
    sample_type: pitches
    missing_data:
      policy: record_missing
      reasons: [EXPECTED_PITCHER_UNKNOWN, SOURCE_UNAVAILABLE, PLAYER_NOT_COVERED, NO_EVENTS_IN_WINDOW]
    applicable_profiles: [RECENT_7D]
    profiles:
      - window_profile: RECENT_7D
        minimum_sample_required: 25
        scoring:
          # D-178 (2026-09-03): batter ISO against the starter's top
          # put-away-share pitch (K%-pitch fallback), percent scale. The
          # D-175 whiff-suppression leg measured backwards for home runs
          # (-15% to -24% for the low-whiff group), so production alone
          # grades the exploitation. Edges: -19% at .05-.10, +35% at .25+.
          # Domain runs to 400: ISO's ceiling is 4.000 on thin samples
          # (D-179).
          - method: bucketed
            domain_min: "0"
            domain_max: "400"
            buckets:
              - { lower: "0", upper: "10", points: "0" }
              - { lower: "10", upper: "15", points: "0.4" }
              - { lower: "15", upper: "20", points: "0.7" }
              - { lower: "20", upper: "25", points: "1" }
              - { lower: "25", upper: "400", points: "1.5" }
  - component_id: attack_angle_quality
    scoring_method: bucketed
    direction: higher_is_better
    max_points: "1"
    # D-184: league-average award 0.438 (2026 season board, 381 batters).
    # D-188: rescaled x10/7 with max_points; the prior stays ~63% of max.
    prior_points: "0.63"
    shrink_strength: 25
    sample_type: swings
    missing_data:
      policy: record_missing
      reasons: [NO_EVENTS_IN_WINDOW, TRACKING_UNAVAILABLE, INVALID_SOURCE_VALUE, SOURCE_UNAVAILABLE, PLAYER_NOT_COVERED]
    applicable_profiles: [RECENT_7D]
    profiles:
      - window_profile: RECENT_7D
        minimum_sample_required: 25
        scoring:
          - method: bucketed
            domain_min: "0"
            domain_max: "100"
            measurement_id: ideal_attack_angle_pct
            buckets:
              - { lower: "0", upper: "38", points: "0" }
              - { lower: "38", upper: "42", points: "0.29" }
              - { lower: "42", upper: "46", points: "0.5" }
              - { lower: "46", upper: "52", points: "0.71" }
              - { lower: "52", upper: "58", points: "0.86" }
              - { lower: "58", upper: "100", points: "1" }
          # Schema requires one bucket set per measurement. The proxy block is
          # dormant: no proxy formula is implemented (Q21 open), so no
          # observation ever carries that measurement id.
          - method: bucketed
            domain_min: "0"
            domain_max: "100"
            measurement_id: attack_angle_threshold_proxy
            buckets:
              - { lower: "0", upper: "60", points: "0" }
              - { lower: "60", upper: "100", points: "1" }
  - component_id: bat_speed
    scoring_method: bucketed
    direction: higher_is_better
    max_points: "0.3"
    # D-184: league-average award 0.249 (2026 season board, 381 batters).
    # D-188: rescaled x0.5 with max_points; the prior stays ~42% of max.
    prior_points: "0.125"
    shrink_strength: 25
    sample_type: swings
    missing_data:
      policy: record_missing
      reasons: [NO_EVENTS_IN_WINDOW, TRACKING_UNAVAILABLE, INVALID_SOURCE_VALUE, SOURCE_UNAVAILABLE, PLAYER_NOT_COVERED]
    applicable_profiles: [RECENT_7D]
    profiles:
      - window_profile: RECENT_7D
        minimum_sample_required: 25
        scoring:
          - method: bucketed
            domain_min: "0"
            domain_max: "130"
            buckets:
              - { lower: "0", upper: "69", points: "0" }
              - { lower: "69", upper: "70.5", points: "0.1" }
              - { lower: "70.5", upper: "72", points: "0.2" }
              - { lower: "72", upper: "130", points: "0.3" }
  - component_id: pull_pct_air_balls
    scoring_method: bucketed
    # D-175 ruling 2 (D-183 ships what D-176's merge dropped): the season
    # curve is a band — +61% at 35-38%, -33% at 60%+ — so the direction is
    # "band", not monotone; the label reads as a comment note.
    direction: band
    max_points: "1"
    # D-184: league-average award 1.137 (381 batters, production spray
    # convention). Shrinkage k=5 — the D-133 light L7 air-ball floor.
    # D-188: rescaled x0.5 with max_points; the prior stays 57% of max.
    prior_points: "0.57"
    shrink_strength: 5
    sample_type: air_balls
    missing_data:
      policy: record_missing
      reasons: [NO_EVENTS_IN_WINDOW, TRACKING_UNAVAILABLE, INVALID_SOURCE_VALUE, SOURCE_UNAVAILABLE, PLAYER_NOT_COVERED]
    applicable_profiles: [RECENT_7D]
    profiles:
      - window_profile: RECENT_7D
        minimum_sample_required: 15
        scoring:
          - method: bucketed
            domain_min: "0"
            domain_max: "100"
            buckets:
              - { lower: "0", upper: "30", points: "0.25" }
              - { lower: "30", upper: "32", points: "0.5" }
              - { lower: "32", upper: "35", points: "0.75" }
              - { lower: "35", upper: "45", points: "1" }
              - { lower: "45", upper: "50", points: "0.75" }
              - { lower: "50", upper: "55", points: "0.5" }
              - { lower: "55", upper: "60", points: "0.25" }
              - { lower: "60", upper: "100", points: "0.125" }
  - component_id: park
    scoring_method: bucketed
    direction: higher_is_better
    max_points: "1"
    # D-184: league-average award 0.370 over the 60 pinned venue-side cells.
    prior_points: "0.37"
    sample_type: plate_appearances
    missing_data:
      policy: record_missing
      reasons: [SOURCE_UNAVAILABLE, EXPECTED_PITCHER_UNKNOWN]
    applicable_profiles: [RECENT_7D]
    profiles:
      - window_profile: RECENT_7D
        minimum_sample_required: 1
        scoring:
          - method: bucketed
            domain_min: "0"
            domain_max: "200"
            buckets:
              - { lower: "0", upper: "95", points: "0" }
              - { lower: "95", upper: "100", points: "0.15" }
              - { lower: "100", upper: "105", points: "0.3" }
              - { lower: "105", upper: "110", points: "0.55" }
              - { lower: "110", upper: "115", points: "0.75" }
              - { lower: "115", upper: "120", points: "0.9" }
              - { lower: "120", upper: "200", points: "1" }
  - component_id: weather
    scoring_method: bucketed
    direction: higher_is_better
    max_points: "1"
    # D-184: league-average award 0.669 over 2,454 games (roofed venues at
    # the 72F neutral per D-111's roof rule).
    prior_points: "0.67"
    sample_type: games
    missing_data:
      policy: record_missing
      reasons: [WEATHER_UNAVAILABLE, SOURCE_UNAVAILABLE]
    applicable_profiles: [RECENT_7D]
    profiles:
      - window_profile: RECENT_7D
        minimum_sample_required: 1
        scoring:
          # D-175 temperature ramp (degrees F, PO 2026-09-03), replacing the
          # v2.2 edges: suppression below 50, flat-ish through 62-80, and a
          # warm boost above 80. The award stays capped at the component max
          # per the PO's 2026-08-24 ruling.
          - method: bucketed
            domain_min: "0"
            domain_max: "120"
            buckets:
              - { lower: "0", upper: "50", points: "0" }
              - { lower: "50", upper: "56", points: "0.2" }
              - { lower: "56", upper: "62", points: "0.4" }
              - { lower: "62", upper: "72", points: "0.55" }
              - { lower: "72", upper: "80", points: "0.65" }
              - { lower: "80", upper: "85", points: "0.8" }
              - { lower: "85", upper: "90", points: "0.9" }
              - { lower: "90", upper: "120", points: "1" }
