name: Morning refresh

# D-136 (PO): "refresh every morning whenever savant and the rest update
# their numbers from day before." The app's season sources day-anchor at
# 09:00 UTC (5:00 AM Eastern through the season, per D-139); this job
# wakes the deployed app right after the flip and loads the board, so the
# season fetches for the new anchor day and today's board build happen
# HERE — the first real visitor of the morning lands on a warm board
# instead of a cold multi-minute build.
# A future date still loads on request; nothing about that path changes.
# NOTE (D-139): GitHub registers scheduled workflows only from the
# repository's DEFAULT branch, so this file must also live on `main` —
# keep the two copies identical.

"on":
  schedule:
    # 09:30 UTC — after the 09:00-UTC anchor flip, with slack for the
    # sources' overnight publishes to settle.
    - cron: "30 9 * * *"
    # D-193 (PO: "make sure we have odds for all games"): cluster triggers
    # through the day, so every fixture's own sweep window (first pitch
    # minus 2.5h) has a trigger inside it. Each load prices only the
    # fixtures in their window — one request per fixture, once, near its
    # own first pitch; a load with nothing in window spends nothing.
    #   14:05 UTC (10:05 AM ET) — catches the rare 11 AM ET morning starts
    #   16:05 UTC (12:05 PM ET) — the 1-2 PM ET afternoon cluster
    #   18:35 UTC ( 2:35 PM ET) — the 3 PM ET cluster
    #   20:05 UTC ( 4:05 PM ET) — the 4-5 PM ET cluster
    #   21:35 UTC ( 5:35 PM ET) — the 6:40-7:15 PM ET main cluster
    #   23:05 UTC ( 7:05 PM ET) — the 8-9 PM ET cluster
    #   01:35 UTC ( 9:05 PM ET) — the West Coast ~10 PM ET late cluster
    - cron: "5 14 * * *"
    - cron: "5 16 * * *"
    - cron: "35 18 * * *"
    - cron: "5 20 * * *"
    - cron: "35 21 * * *"
    - cron: "5 23 * * *"
    - cron: "35 1 * * *"
  workflow_dispatch:

# Read-only contents: the checkout needs it (the repo is private — {} got
# the job's token "repository not found" on fetch, D-140). Nothing else.
permissions:
  contents: read

jobs:
  wake:
    name: Wake the app and build today's board
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # D-140: the runner's workspace starts empty — without this checkout the
      # driver script isn't on disk and the job died four mornings running
      # with MODULE_NOT_FOUND before ever touching the app.
      - name: Check out the workflow files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install a headless browser
        run: |
          npm init -y >/dev/null
          npm install playwright-core@latest >/dev/null 2>&1
          npx playwright-core install --with-deps chromium

      - name: Load the board and wait for it to render
        run: node .github/workflows/morning-refresh.mjs
