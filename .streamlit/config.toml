# GM-030 manual-review prototype — conservative Streamlit configuration for
# local development and Streamlit Community Cloud. No secrets, no analytics
# identifiers, no private endpoints: the app works without any secret.

[browser]
# The dashboard performs no network request; Streamlit's own usage
# telemetry is disabled so that stays literally true.
gatherUsageStats = false

[server]
headless = true

[client]
# TEMPORARY (D-138 diagnosis): the deployed app renders Streamlit's redacted
# ImportError page and the host's logs are owner-only, so details are
# switched on for one deploy to read the real traceback off the page.
# Reverts to "type" the moment the failure is identified.
showErrorDetails = true

[theme]
# D-003's visual language, first coat: the original-Xbox dark-green mood with
# neon-lime accents, applied through Streamlit's built-in theming. The full
# console shell (glowing orb, geometric grid, console navigation) is its own
# deferred ticket — this is the palette, not the artwork.
base = "dark"
primaryColor = "#9bf00b"
backgroundColor = "#0d1f0d"
secondaryBackgroundColor = "#132b13"
textColor = "#e8f5e0"
